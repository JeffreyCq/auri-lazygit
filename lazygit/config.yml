# AURI (Endor Labs) inside Lazygit
#
# Copy this entry into your Lazygit config (`lazygit --print-config-dir` shows
# where that is; on macOS it's usually ~/Library/Application Support/lazygit/config.yml),
# or merge it in with LG_CONFIG_FILE:
#   LG_CONFIG_FILE="$HOME/.config/lazygit/config.yml,/path/to/this/config.yml" lazygit
#
# Requirement: `auri-tui` must be on your PATH (`make install`). The command
# uses output: terminal, so Lazygit suspends, the TUI takes over the screen,
# and quitting it (q) returns you to Lazygit.
#
# auri-tui detects the git repo and target from the current working directory
# itself — it doesn't need any panel context or template variables. One global
# binding is all that's needed; the in-app menu lets you pick what to scan
# (local changes, a specific commit, or the full repository).
customCommands:
  - key: "<c-a>"
    context: "global"
    description: "AURI: open Endor Labs scan menu"
    command: "auri-tui"
    output: terminal
